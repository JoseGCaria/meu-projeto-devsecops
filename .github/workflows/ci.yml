name: Pipeline DevSecOps - CI


on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main]

jobs:
  # JOB 1: Instalação e Testes Unitários com Cobertura
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Configurar o ambiente Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependências da API
        run: npm install

      - name: Executar testes unitários e gerar cobertura (Jest)
        run: npm test -- --coverage

      # Salva o relatório de cobertura temporariamente para o Sonar usar no outro JOB
      - name: Salvar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # JOB 2: Análise de Segurança de Dependências (Snyk)
  security-snyk:
    runs-on: ubuntu-latest
    needs: build-and-test 

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Executar o scanner do Snyk para achar vulnerabilidades
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} 

  # JOB 3: Análise de Qualidade de Código (SonarCloud)
  sonarcloud:
    runs-on: ubuntu-latest
    needs: build-and-test 

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

     
      - name: Baixar relatório de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Executar análise do SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 
