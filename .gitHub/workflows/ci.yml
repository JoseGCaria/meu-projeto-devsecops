name: CI DevSecOps Pipeline (UFLA)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: Testes Unitários e Qualidade de Código
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Instalar Dependências
        run: npm install
        
      - name: Executar Testes (QA)
        run: npm test

  # JOB 2: Análise de Segurança (Snyk Scan)
  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v3
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ snyk_uat.1fcad39e.eyJlIjoxNzg5MDY4MTc5LCJoIjoic255ay5pbyIsImoiOiJBWjY5U2xXcUhMR2JPQWtWZTlNYlZ3IiwicyI6ImV4ZkFuRVYyU1h5YWVaaXpZQm5UMEEiLCJ0aWQiOiJBQUFBQUFBQUFBQUFBQUFBQUFBQUFBIn0.oPa2p-hPwHidRTqBMNbvkyQdAGuH9zVSeAjQDehBKZ0B3ax_rE7HtAFmRepueyHcgVjZjdk5k_XXNQK0BELGCg}}

  # JOB 3: Análise de Qualidade (SonarCloud Scan)
  sonarcloud:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{453f21bd4bfd3dc3f82b3070fdde0400506b9a9f}}' 